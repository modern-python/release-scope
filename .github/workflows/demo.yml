name: Demo

# Publishes the demo page to GitHub Pages: the CLI collects the made-up scenario in
# demo/scenario.py, so the page and its report.json match the released code. The
# screenshot.png it publishes is the image the README shows.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv python install 3.13
      - run: uv python pin 3.13
      - run: just install
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: just demo-screenshot
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

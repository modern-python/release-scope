<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release scope</title>
<script>
  if (!/(\/|\.html)$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
</script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --panel: #f6f8fa;
    --accent: #0969da; --bad: #cf222e; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --panel: #161b22;
      --accent: #4493f8; --bad: #f85149; --warn: #d29922;
    }
  }
  [x-cloak] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font: 12px ui-monospace, monospace; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  ul { margin: 4px 0; padding-left: 20px; }
  details { margin: 8px 0; }
  summary { cursor: pointer; }
  textarea { width: 100%; min-height: 72px; font: 12px ui-monospace, monospace; background: var(--panel);
    color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px; resize: vertical; }
  button { font: inherit; padding: 2px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--fg); cursor: pointer; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .scroll { overflow-x: auto; }
  .services { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
  .card label { display: block; padding: 2px 0; cursor: pointer; }
  .outputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 16px; }
  .out-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  tr.out-of-scope td { opacity: 0.55; }
</style>
</head>
<body>
<main x-data="releaseScope" x-cloak>
  <p x-show="failure" class="bad" x-text="failure"></p>
  <template x-if="report">
    <div>
      <h1 x-text="report.jira_scope.length ? 'Release scope: ' + report.jira_scope.join(', ') : 'Release scope'"></h1>
      <p class="muted">
        Collected <span x-text="collectedAt"></span> UTC. Changes run from the commit on
        <code x-text="report.production_environment"></code> to the head of the default branch<span
          x-text="report.jira_scope.length ? '; rows above the latest change linked to the issues are out of scope.' : '.'"></span>
      </p>
      <ul x-show="report.jira_scope.length">
        <template x-for="key in report.jira_scope" :key="key">
          <li>
            <a :href="issue(key) && issue(key).url" x-text="key"></a>
            <span x-text="issue(key) ? issue(key).summary + ' · ' + issue(key).status : 'not found in Jira'"></span>
          </li>
        </template>
      </ul>
      <template x-for="message in problems" :key="message">
        <p class="bad" x-text="message"></p>
      </template>

      <h2>Release</h2>
      <p x-show="!pickable.length" class="muted">No service has a tag between production and the head of the default branch.</p>
      <div class="services">
        <template x-for="service in pickable" :key="service.project">
          <div class="card">
            <h3><a :href="service.project_url" x-text="service.project"></a></h3>
            <label>
              <input type="radio" :name="service.project" value="" x-model="picks[service.project]"> none
            </label>
            <template x-for="candidate in service.candidates" :key="candidate.tag.name">
              <label>
                <input type="radio" :name="service.project" :value="candidate.tag.name" x-model="picks[service.project]">
                <span x-text="candidate.tag.name"></span>
                <span x-text="pipelineIcon(candidate.tag.pipeline)"></span>
                <span class="muted" x-text="plural(candidate.changes, 'change') + ', ' + plural(candidate.jira_keys.length, 'task')"></span>
              </label>
            </template>
          </div>
        </template>
      </div>
      <p x-show="notice" class="warn" x-text="notice"></p>

      <div class="outputs" x-show="picked.length">
        <section>
          <div class="out-head">
            <h3 x-text="'Jira tasks (' + tasks.length + ')'"></h3>
            <span>
              <button type="button" @click="copy(taskKeys)">Copy keys</button>
              <button type="button" @click="copy(taskJql)">Copy JQL</button>
            </span>
          </div>
          <ul>
            <template x-for="task in tasks" :key="task.key">
              <li>
                <a :href="task.url" x-text="task.key"></a>
                <span x-text="task.issue ? task.issue.summary + ' · ' + task.issue.status : ''"></span>
                <span x-show="task.issue && task.issue.status_category !== 'done'" class="warn">not done</span>
                <span x-show="isMissing(task.key)" class="warn">not found in Jira</span>
              </li>
            </template>
          </ul>
          <textarea readonly x-text="taskKeys"></textarea>
        </section>
        <section>
          <div class="out-head">
            <h3>Tag pipelines</h3>
            <button type="button" @click="copy(pipelinesMarkdown)">Copy</button>
          </div>
          <ul>
            <template x-for="item in picked" :key="item.service.project">
              <li>
                <span x-text="item.service.project + ' ' + item.candidate.tag.name + ':'"></span>
                <template x-if="item.candidate.tag.pipeline">
                  <a :href="item.candidate.tag.pipeline.url"
                    x-text="pipelineIcon(item.candidate.tag.pipeline) + ' #' + item.candidate.tag.pipeline.id"></a>
                </template>
                <span x-show="!item.candidate.tag.pipeline" class="warn">no pipeline</span>
              </li>
            </template>
          </ul>
          <textarea readonly x-text="pipelinesMarkdown"></textarea>
        </section>
        <section>
          <div class="out-head">
            <h3>Compare</h3>
            <button type="button" @click="copy(compareMarkdown)">Copy</button>
          </div>
          <ul>
            <template x-for="item in picked" :key="item.service.project">
              <li>
                <span x-text="item.service.project + ':'"></span>
                <a :href="item.candidate.compare_url" x-text="compareLabel(item)"></a>
              </li>
            </template>
          </ul>
          <textarea readonly x-text="compareMarkdown"></textarea>
        </section>
      </div>

      <h2>Services</h2>
      <p x-show="!pending.length" class="muted">All services are up to date.</p>
      <div class="scroll" x-show="pending.length">
        <table>
          <thead>
            <tr>
              <th>Service</th>
              <template x-for="name in environmentNames" :key="name"><th x-text="name"></th></template>
              <th>Pending</th>
              <th>Not done</th>
              <th>Failed jobs</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="service in pending" :key="service.project">
              <tr>
                <td><a :href="'#' + anchor(service)" x-text="service.project"></a></td>
                <template x-for="name in environmentNames" :key="name">
                  <td>
                    <template x-if="environment(service, name)">
                      <a :href="environment(service, name).deployment_url" x-text="environment(service, name).ref"></a>
                    </template>
                  </td>
                </template>
                <td x-text="pendingText(service)"></td>
                <td x-text="notDone(service) || ''"></td>
                <td x-text="failureCounts(service)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <details x-show="upToDate.length">
        <summary x-text="plural(upToDate.length, 'service') + ' up to date'"></summary>
        <ul>
          <template x-for="service in upToDate" :key="service.project">
            <li>
              <a :href="service.project_url" x-text="service.project"></a>
              <span class="muted" x-text="environment(service, report.production_environment).ref"></span>
            </li>
          </template>
        </ul>
      </details>

      <template x-for="service in pending" :key="service.project">
        <section :id="anchor(service)">
          <h2><a :href="service.project_url" x-text="service.project"></a></h2>
          <p x-show="service.error" class="bad" x-text="service.error"></p>
          <template x-for="warning in service.warnings" :key="warning">
            <p class="warn" x-text="warning"></p>
          </template>
          <p x-show="service.release && service.release.pending_merge_requests.length">
            Not merged:
            <template x-for="item in service.release ? service.release.pending_merge_requests : []" :key="item.iid">
              <a :href="item.url" x-text="'!' + item.iid + ' ' + item.title + ' '"></a>
            </template>
          </p>
          <details x-show="service.rows.length">
            <summary x-text="plural(service.rows.length, 'change') + ' since ' + productionRef(service)"></summary>
            <div class="scroll">
              <table>
                <thead>
                  <tr><th>Tag</th><th>Change</th><th>Jira</th><th>Deployed to</th><th>Failed jobs</th></tr>
                </thead>
                <tbody>
                  <template x-for="(row, index) in service.rows" :key="index">
                    <tr :class="{ 'out-of-scope': !row.in_scope }">
                      <td>
                        <template x-for="tag in row.tags" :key="tag.name">
                          <div>
                            <a :href="tag.pipeline ? tag.pipeline.url : tag.url" x-text="tag.name"></a>
                            <span x-text="pipelineIcon(tag.pipeline)"></span>
                          </div>
                        </template>
                      </td>
                      <td>
                        <span x-show="row.linked" title="Linked to the issues">🎯</span>
                        <template x-for="item in row.merge_requests" :key="item.iid">
                          <div>
                            <a :href="item.url" x-text="'!' + item.iid"></a>
                            <span x-text="item.title + (item.author ? ' · @' + item.author : '')"></span>
                          </div>
                        </template>
                        <template x-for="item in row.merge_requests.length ? [] : row.commits" :key="item.sha">
                          <div>
                            <a :href="item.url"><code x-text="item.short_sha"></code></a>
                            <span x-text="item.title + (item.author ? ' · ' + item.author : '')"></span>
                          </div>
                        </template>
                        <span x-show="!row.in_scope" class="muted">out of scope</span>
                      </td>
                      <td>
                        <template x-for="key in row.jira_keys" :key="key.key">
                          <div>
                            <a :href="key.url" x-text="key.key"></a>
                            <span x-text="issue(key.key) ? issue(key.key).summary + ' · ' + issue(key.key).status : ''"></span>
                          </div>
                        </template>
                      </td>
                      <td x-text="row.environments.join(', ')"></td>
                      <td>
                        <template x-for="(line, position) in failedJobs(row)" :key="position">
                          <div>
                            <span x-text="line.label"></span>
                            <a :href="line.url" x-text="line.name"></a>
                            <span x-show="line.allowed" class="muted">(allowed)</span>
                          </div>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </details>
        </section>
      </template>
      <p class="muted">Legend: ✅ success · ❌ failed · 🔄 running · ⏭ canceled or skipped · ⚠️ no pipeline</p>
    </div>
  </template>
</main>
<script>
  const ICONS = {
    success: "✅", failed: "❌", created: "🔄", waiting_for_resource: "🔄", preparing: "🔄", pending: "🔄",
    running: "🔄", scheduled: "🔄", canceled: "⏭", skipped: "⏭", manual: "⏭",
  };

  document.addEventListener("alpine:init", () => {
    Alpine.data("releaseScope", () => ({
      report: null,
      failure: "",
      notice: "",
      picks: {},

      async init() {
        try {
          const response = await fetch("report.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`report.json returned ${response.status}`);
          const report = await response.json();
          for (const service of report.services) {
            const tag = service.release && service.release.tag ? service.release.tag.name : "";
            this.picks[service.project] = service.candidates.some((item) => item.tag.name === tag) ? tag : "";
          }
          this.report = report;
        } catch (error) {
          this.failure = `Cannot load the report: ${error.message}.`;
        }
      },

      get collectedAt() {
        return this.report.collected_at.slice(0, 16).replace("T", " ");
      },
      get deployed() {
        return this.report.services.filter((service) => service.error || this.production(service));
      },
      get pickable() {
        return this.deployed.filter((service) => service.candidates.length);
      },
      get pending() {
        return this.deployed.filter((service) => service.error || service.rows.length);
      },
      get upToDate() {
        return this.deployed.filter((service) => !service.error && !service.rows.length);
      },
      get problems() {
        const jira = this.report.jira;
        return jira && jira.error ? [jira.error] : [];
      },
      get environmentNames() {
        const names = new Set([this.report.production_environment]);
        for (const service of this.deployed) for (const item of service.environments) names.add(item.name);
        return [...names];
      },
      get picked() {
        return this.pickable
          .map((service) => ({
            service,
            candidate: service.candidates.find((item) => item.tag.name === this.picks[service.project]),
          }))
          .filter((item) => item.candidate);
      },
      get tasks() {
        const tasks = new Map();
        for (const { candidate } of this.picked) {
          for (const key of candidate.jira_keys) {
            if (!tasks.has(key.key)) tasks.set(key.key, { key: key.key, url: key.url, issue: this.issue(key.key) });
          }
        }
        return [...tasks.values()];
      },
      get taskKeys() {
        return this.tasks.map((task) => task.key).join("\n");
      },
      get taskJql() {
        return `key in (${this.tasks.map((task) => task.key).join(", ")})`;
      },
      get pipelinesMarkdown() {
        return this.picked
          .map(({ service, candidate }) => {
            const pipeline = candidate.tag.pipeline;
            const label = `${service.project} ${candidate.tag.name}`;
            return pipeline ? `- [${label}](${pipeline.url}) ${pipeline.status}` : `- ${label}: no pipeline`;
          })
          .join("\n");
      },
      get compareMarkdown() {
        return this.picked
          .map((item) => `- ${item.service.project}: [${this.compareLabel(item)}](${item.candidate.compare_url})`)
          .join("\n");
      },

      issue(key) {
        return this.report.jira ? this.report.jira.issues[key] : undefined;
      },
      isMissing(key) {
        return Boolean(this.report.jira && this.report.jira.missing.includes(key));
      },
      environment(service, name) {
        return service.environments.find((item) => item.name === name);
      },
      production(service) {
        return this.environment(service, this.report.production_environment);
      },
      productionRef(service) {
        const production = this.production(service);
        if (!production) return "";
        return production.tag ? production.ref : production.sha.slice(0, 8);
      },
      compareLabel({ service, candidate }) {
        return `${this.productionRef(service)}...${candidate.tag.name}`;
      },
      pipelineIcon(pipeline) {
        return pipeline ? ICONS[pipeline.status] || pipeline.status : "⚠️";
      },
      plural(count, noun) {
        return `${count} ${noun}${count === 1 ? "" : "s"}`;
      },
      anchor(service) {
        return `service-${service.project.replace(/[^A-Za-z0-9]+/g, "-")}`;
      },
      pendingText(service) {
        if (service.error) return "failed to collect";
        const tag = service.candidates.length ? `, newest tag ${service.candidates[0].tag.name}` : ", untagged";
        return this.plural(service.rows.length, "change") + tag;
      },
      notDone(service) {
        const keys = new Set(service.rows.flatMap((row) => row.jira_keys.map((key) => key.key)));
        return [...keys].filter((key) => this.issue(key) && this.issue(key).status_category !== "done").length;
      },
      failureCounts(service) {
        const pipelines = service.rows.flatMap((row) => [row.main_pipeline, ...row.tags.map((tag) => tag.pipeline)]);
        const jobs = pipelines.filter(Boolean).flatMap((pipeline) => pipeline.failed_jobs);
        const allowed = jobs.filter((job) => job.allow_failure).length;
        const blocking = jobs.length - allowed;
        return [blocking ? `❌ ${blocking}` : "", allowed ? `⚠️ ${allowed} allowed` : ""].filter(Boolean).join(" · ");
      },
      failedJobs(row) {
        const lines = [];
        const add = (label, pipeline) => {
          for (const job of pipeline.failed_jobs) {
            lines.push({ label, name: job.name, url: job.downstream_pipeline_url || job.url, allowed: job.allow_failure });
          }
        };
        if (row.main_pipeline) add(`main ${this.pipelineIcon(row.main_pipeline)}`, row.main_pipeline);
        for (const tag of row.tags) if (tag.pipeline) add(`tag ${tag.name}`, tag.pipeline);
        return lines;
      },
      async copy(text) {
        try {
          await navigator.clipboard.writeText(text);
          this.notice = "";
        } catch {
          this.notice = "Copying needs HTTPS; select the text in the box instead.";
        }
      },
    }));
  });
</script>
<script defer src="alpine.min.js"></script>
</body>
</html>
